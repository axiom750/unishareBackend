# Production Configuration for UniShare Backend
# This is the COMPLETE production configuration
# All values use environment variables for security

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10000ms}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1  # Pre-warm 1 connection to amortize TLS handshake cost
          max-wait: -1ms
          # Disable validation that triggers extra TLS handshakes
          test-on-borrow: false
          test-on-return: false
          test-while-idle: false

  application:
    name: unishare

  production:
    status: true

  version: 1.0

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

brevo:
  api-key: ${BREVO_API_KEY:}

mail:
  from-email: ${MAIL_FROM_EMAIL:noreply@unishare.com}
  from-name: UniShare

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

google:
  clientId: ${GOOGLE_CLIENT_ID:}
  clientSecret: ${GOOGLE_CLIENT_SECRET:}
  redirectURL: ${GOOGLE_REDIRECT_URL:http://localhost:8080/api/auth/google/callback}
  auth:
    endPoint: https://oauth2.googleapis.com/token

jwt:
  secret: ${JWT_SECRET:}
  expiry: 86400000

production:
  status: true

github:
  clientId: ${GITHUB_CLIENT_ID:}
  clientSecret: ${GITHUB_CLIENT_SECRET:}
  redirectUrl: ${GITHUB_REDIRECT_URL:http://localhost:8080/api/auth/github/callback}
  tokenUrl: https://github.com/login/oauth/access_token
  userUrl: https://api.github.com/user

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${PORT:8080}

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.unishare: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN

unishare:
  idempotency:
    ttl: 5m
  redis:
    diagnostics:
      enabled: false  # Diagnostic completed - root cause: multiple TLS handshakes (fixed)
