# Production Configuration for UniShare Backend
# This is the COMPLETE production configuration
# All values use environment variables for security
#
# DEPLOYMENT CHECKLIST:
# 1. Set SPRING_PROFILES_ACTIVE=prod
# 2. Set GOD_ACCOUNT_INITIAL_PASSWORD environment variable
# 3. Deploy with security scanning and seeding enabled
# 4. GodAccount will be created automatically on first startup
# 5. Roles declared on UnishareApplication will be synchronized
# 6. Permissions will be scanned from controllers and synchronized

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10000ms}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  application:
    name: unishare

  production:
    status: true

  version: 1.0

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate  # PRODUCTION: Only updates schema, does not drop tables
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

brevo:
  api-key: ${BREVO_API_KEY:}

mail:
  from-email: ${MAIL_FROM_EMAIL:noreply@unishare.com}
  from-name: UniShare

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

google:
  clientId: ${GOOGLE_CLIENT_ID:}
  clientSecret: ${GOOGLE_CLIENT_SECRET:}
  redirectURL: ${GOOGLE_REDIRECT_URL:https://unisharebeta.onrender.com/api/auth/google/callback}
  auth:
    endPoint: https://oauth2.googleapis.com/token

jwt:
  secret: ${JWT_SECRET:}
  expiry: 86400000

production:
  status: true

github:
  clientId: ${GITHUB_CLIENT_ID:}
  clientSecret: ${GITHUB_CLIENT_SECRET:}
  redirectUrl: ${GITHUB_REDIRECT_URL:https://unisharebeta.onrender.com/api/auth/github/callback}
  tokenUrl: https://github.com/login/oauth/access_token
  userUrl: https://api.github.com/user

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${PORT:8080}

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.unishare: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN

# ============================================================
# SECURITY CONFIGURATION - CRITICAL FOR RBAC SYSTEM
# ============================================================
unishare:
  idempotency:
    ttl: 5m
  redis:
    diagnostics:
      enabled: false  # Set to true to enable detailed TCP/TLS network diagnostics
  
  # Security scanning/seeding EXECUTION flags only.
  # Identity (GodAccount, GodRole, roles, permissions) is declared by annotations,
  # never here. Seeding requires the matching scanning flag; invalid combinations
  # fail startup.
  security:
    scanning:
      enabled: true
      god-account: true
      god-role: true
      roles: true
      permissions: true

    seeding:
      enabled: true
      god-account: true
      god-role: true
      roles: true
      permissions: true
      god-account-role: true

    # GodAccount initial password: read from the environment, used only when the
    # GodAccount is first created. Never put a literal password here.
    god-account:
      initial-password: ${GOD_ACCOUNT_INITIAL_PASSWORD:}
