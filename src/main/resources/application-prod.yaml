# Production Configuration for UniShare Backend
# This is the COMPLETE production configuration
# All values use environment variables for security
#
# DEPLOYMENT CHECKLIST:
# 1. Set SPRING_PROFILES_ACTIVE=prod
# 2. Deploy with security.seed.enabled=true to create roles
# 3. Create SUPERUSER account via normal registration
# 4. Set SUPERUSER_BOOTSTRAP_ENABLED=true to assign SUPERUSER role
# 5. Restart application to bootstrap SUPERUSER
# 6. (Optional) Set SUPERUSER_BOOTSTRAP_ENABLED=false after successful bootstrap

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10000ms}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  application:
    name: unishare

  production:
    status: true

  version: 1.0

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update  # PRODUCTION: Only updates schema, does not drop tables
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

brevo:
  api-key: ${BREVO_API_KEY:}

mail:
  from-email: ${MAIL_FROM_EMAIL:noreply@unishare.com}
  from-name: UniShare

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

google:
  clientId: ${GOOGLE_CLIENT_ID:}
  clientSecret: ${GOOGLE_CLIENT_SECRET:}
  redirectURL: ${GOOGLE_REDIRECT_URL:https://unisharebeta.onrender.com/api/auth/google/callback}
  auth:
    endPoint: https://oauth2.googleapis.com/token

jwt:
  secret: ${JWT_SECRET:}
  expiry: 86400000

production:
  status: true

github:
  clientId: ${GITHUB_CLIENT_ID:}
  clientSecret: ${GITHUB_CLIENT_SECRET:}
  redirectUrl: ${GITHUB_REDIRECT_URL:https://unisharebeta.onrender.com/api/auth/github/callback}
  tokenUrl: https://github.com/login/oauth/access_token
  userUrl: https://api.github.com/user

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${PORT:8080}

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.unishare: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN

# ============================================================
# SECURITY CONFIGURATION - CRITICAL FOR RBAC SYSTEM
# ============================================================
unishare:
  idempotency:
    ttl: 5m
  redis:
    diagnostics:
      enabled: false  # Set to true to enable detailed TCP/TLS network diagnostics
  
  # RBAC Security Configuration
  security:
    seed:
      enabled: true  # REQUIRED: Creates default roles (USER, MODERATOR, ADMIN, SUPERUSER)
    
    superuser:
      # STEP 1: Keep enabled=false, deploy, create SUPERUSER account via registration
      # STEP 2: Set enabled=true, restart to bootstrap SUPERUSER role
      # STEP 3: (Optional) Set back to false after successful bootstrap
      enabled: ${SUPERUSER_BOOTSTRAP_ENABLED:false}
      email: ${SUPERUSER_EMAIL:}  # REQUIRED: Email of user to receive SUPERUSER role
    
    permission:
      scanner:
        enabled: true  # REQUIRED: Scans @Permission annotations and syncs to database